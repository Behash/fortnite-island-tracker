name: Daily Fortnite Island Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  fetch-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch metrics for all islands
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          python3 fortnite_island.py --island 9642-0223-9671 --start "$TODAY" --end "$TODAY" --csv island_metrics_history.csv
          python3 fortnite_island.py --island 9752-7422-1395 --start "$TODAY" --end "$TODAY" --csv island_metrics_history.csv

      - name: Print today's summary
        run: python3 summary.py --top

      - name: Commit updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add island_metrics_history.csv
          git diff --cached --quiet || git commit -m "chore: daily metrics $(date -u +%Y-%m-%d)"
          git push
